name: Bug report
description: Something looks wrong or doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste real amounts or account names;
        rounded or made-up numbers that show the problem are perfect.
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      placeholder: "1.1.1"
    validations:
      required: true
  - type: input
    id: wealthfolio-version
    attributes:
      label: Wealthfolio version
      placeholder: "3.12.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: If a number differs from Wealthfolio's own performance page, say which month and account.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
