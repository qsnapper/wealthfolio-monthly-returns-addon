name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Wealthfolio shows the manifest version; the zip is named after the
      # package version. A mismatch is silent until someone installs it.
      - name: Versions in package.json and manifest.json agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          man=$(node -p "require('./manifest.json').version")
          echo "package.json=$pkg manifest.json=$man"
          [ "$pkg" = "$man" ] || { echo "::error::version mismatch"; exit 1; }

      - run: pnpm type-check

      - run: pnpm test

      - run: pnpm bundle
